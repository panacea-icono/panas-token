name: CD - panas_token-contracts

on:
  workflow_call:
    secrets:
      ALGORAND_MAINNET_DEPLOYER_MNEMONIC:
        required: false
      ALGORAND_TESTNET_DEPLOYER_MNEMONIC:
        required: false

jobs:
  deploy-testnet:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: TestNet
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install AlgoKit
        run: pipx install algokit

      - name: Bootstrap dependencies
        run: algokit project bootstrap all --project-name 'panas_token'

      - name: Configure git
        shell: bash
        run: |
          git config --global user.email "actions@github.com" && git config --global user.name "github-actions"

      - name: Deploy to TestNet
        shell: bash
        run: |
          cd projects/panas_token-contracts
          if [ -n "${{ secrets.ALGORAND_TESTNET_DEPLOYER_MNEMONIC }}" ]; then
            echo "Deploying to TestNet..."
            algokit deploy testnet --environment-suffix testnet
          else
            echo "TestNet deployment skipped - no deployer mnemonic configured"
          fi

  deploy-mainnet:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: MainNet
    needs: deploy-testnet
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install AlgoKit
        run: pipx install algokit

      - name: Bootstrap dependencies
        run: algokit project bootstrap all --project-name 'panas_token'

      - name: Configure git
        shell: bash
        run: |
          git config --global user.email "actions@github.com" && git config --global user.name "github-actions"

      - name: Deploy to MainNet
        shell: bash
        run: |
          cd projects/panas_token-contracts
          if [ -n "${{ secrets.ALGORAND_MAINNET_DEPLOYER_MNEMONIC }}" ]; then
            echo "Deploying to MainNet..."
            algokit deploy mainnet --environment-suffix mainnet
          else
            echo "MainNet deployment skipped - no deployer mnemonic configured"
          fi
