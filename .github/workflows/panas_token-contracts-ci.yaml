name: panas_token-contracts CI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'projects/panas_token-contracts/**'
  pull_request:
    branches: [main]
    paths:
      - 'projects/panas_token-contracts/**'

defaults:
  run:
    working-directory: ./projects/panas_token-contracts

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./projects/panas_token-contracts/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build contracts
      run: npm run build
