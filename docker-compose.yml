version: '3.8'

services:
  panas-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - ALGORAND_NETWORK=testnet
      - PANAS_TOTAL_SUPPLY=1000000
      - PANAS_DECIMALS=6
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    networks:
      - panas-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - panas-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=panas_db
      - POSTGRES_USER=panas_user
      - POSTGRES_PASSWORD=panas_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - panas-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - panas-api
    networks:
      - panas-network

volumes:
  redis_data:
  postgres_data:

networks:
  panas-network:
    driver: bridge
